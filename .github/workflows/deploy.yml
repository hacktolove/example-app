name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Deploy to Production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "."
          target: "/var/www/laravel/releases/${{ github.sha }}"

      - name: Activate Release
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            RELEASE=/var/www/laravel/releases/${{ github.sha }}
            SHARED=/var/www/laravel/shared

            cp $SHARED/.env $RELEASE/.env

            # Link shared storage so logs/uploads persist across releases
            mkdir -p $SHARED/storage/app/public \
                     $SHARED/storage/framework/cache \
                     $SHARED/storage/framework/sessions \
                     $SHARED/storage/framework/views \
                     $SHARED/storage/logs
            rm -rf $RELEASE/storage
            ln -s $SHARED/storage $RELEASE/storage

            chown -R www-data:www-data $RELEASE $SHARED/storage
            chmod -R 775 $SHARED/storage $RELEASE/bootstrap/cache

            cd $RELEASE
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force

            # Grant app DB user access to all tables (fixes permission denied on sessions etc.)
            DB_USER=$(grep "^DB_USERNAME=" $RELEASE/.env | cut -d'=' -f2 | tr -d '"'"'"')
            DB_NAME=$(grep "^DB_DATABASE=" $RELEASE/.env | cut -d'=' -f2 | tr -d '"'"'"')
            sudo -u postgres psql -d "$DB_NAME" -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO $DB_USER;" 2>/dev/null || true
            sudo -u postgres psql -d "$DB_NAME" -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO $DB_USER;" 2>/dev/null || true
            sudo -u postgres psql -d "$DB_NAME" -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO $DB_USER;" 2>/dev/null || true

            ln -sfn $RELEASE /var/www/laravel/current
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan queue:restart || true

      - name: Notify Deployment
        if: always()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            echo "Deployment ${{ github.sha }} finished at $(date)" >> /var/www/laravel/deploy.log
