name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Deploy to Production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "."
          target: "/var/www/laravel/releases/${{ github.sha }}"

      - name: Activate Release
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /var/www/laravel/releases/${{ github.sha }}
            cp /var/www/laravel/shared/.env .env
            chown -R www-data:www-data /var/www/laravel/releases/${{ github.sha }}
            chmod -R 775 storage bootstrap/cache
            php artisan key:generate --force || true
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            ln -sfn /var/www/laravel/releases/${{ github.sha }} /var/www/laravel/current
            chown -R www-data:www-data /var/www/laravel/current
            php artisan optimize:clear
            php artisan config:cache
            php artisan queue:restart || true

      - name: Notify Deployment
        if: always()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            echo "Deployment ${{ github.sha }} finished at $(date)" >> /var/www/laravel/deploy.log
