openapi: 3.0.3
info:
  title: Profile API
  description: >
    Subscriber profile lookup and subscription endpoints. Every VAS service
    owns its own telco-owned database, so each request names the service it
    applies to via `serviceid`; services are independent and a subscriber may
    be registered in any combination of them.
  version: 2.0.0
servers:
  - url: /api
    description: Relative to the app's base URL (see APP_URL)
security:
  - ApiKeyAuth: []
paths:
  /check-sub:
    get:
      operationId: checkSub
      summary: Check subscription status for an MSISDN
      parameters:
        - name: number
          in: query
          required: true
          description: >
            Phone number in any format. Digits and an optional leading `+`
            are kept; if no `+` prefix is present, `+249` (Sudan) is
            prepended after stripping leading zeros.
          schema:
            type: string
          example: "+249999900046"
        - name: serviceid
          in: query
          required: true
          description: >
            The service to check, as listed by `GET /vasws/displayall`.
            Each service has its own database; a subscription in one service
            says nothing about any other.
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Current subscription status for the number in this service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckSubResponse'
              examples:
                subscribed:
                  value:
                    msisdn: "+249999900046"
                    serviceid: 1
                    status: 1
                    subscribed: true
                notSubscribed:
                  value:
                    msisdn: "+249999900046"
                    serviceid: 1
                    status: 0
                    subscribed: false
        '400':
          description: Missing or invalid `number` or `serviceid` parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingNumber:
                  value:
                    error: Missing number parameter
                missingServiceId:
                  value:
                    error: Missing serviceid parameter
                invalidNumber:
                  value:
                    error: Invalid number format
                invalidServiceId:
                  value:
                    error: Invalid serviceid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /subscribe:
    post:
      operationId: subscribe
      summary: Subscribe an MSISDN (creates or reactivates its profile)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeRequest'
            example:
              number: "+249999900046"
              serviceid: 1
      responses:
        '200':
          description: Profile created or updated in that service, status set to subscribed (1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscribeResponse'
              examples:
                insert:
                  value:
                    msisdn: "+249999900046"
                    serviceid: 1
                    status: 1
                    action: insert
                    message: Subscription inserted successfully
                update:
                  value:
                    msisdn: "+249999900046"
                    serviceid: 1
                    status: 1
                    action: update
                    message: Subscription updateed successfully
        '400':
          description: Missing or invalid `number` or `serviceid` in the request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingNumber:
                  value:
                    error: Missing number in JSON body
                missingServiceId:
                  value:
                    error: Missing serviceid in JSON body
                invalidNumber:
                  value:
                    error: Invalid number format
                invalidServiceId:
                  value:
                    error: Invalid serviceid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Static key, rotated via `php artisan api-key:generate`.
  schemas:
    CheckSubResponse:
      type: object
      properties:
        msisdn:
          type: string
          example: "+249999900046"
        serviceid:
          type: integer
          description: The service this status applies to.
          example: 1
        status:
          type: integer
          example: 1
        subscribed:
          type: boolean
          example: true
      required: [msisdn, serviceid, status, subscribed]
    SubscribeRequest:
      type: object
      properties:
        number:
          type: string
          description: Phone number in any format (normalized server-side).
          example: "+249999900046"
        serviceid:
          type: integer
          description: >
            The service to subscribe to, as listed by `GET /vasws/displayall`.
          example: 1
      required: [number, serviceid]
    SubscribeResponse:
      type: object
      properties:
        msisdn:
          type: string
          example: "+249999900046"
        serviceid:
          type: integer
          example: 1
        status:
          type: integer
          enum: [1]
          example: 1
        action:
          type: string
          enum: [insert, update]
        message:
          type: string
          example: Subscription inserted successfully
      required: [msisdn, serviceid, status, action, message]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
  responses:
    Unauthorized:
      description: Missing or incorrect X-API-Key header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
    ServerError:
      description: Unexpected database error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Database error
